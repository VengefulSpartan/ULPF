[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelog"
version = "1.0.0"
description = "TRACELOG: universal log pre-processing for perimeter network devices (OCSF 1.1.0, hash-chained, SIEM connectors)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "TRACELOG team (SIH 2026, PS 26156)" }]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "frontend*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
