[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ulpf"
version = "0.1.0"
description = "Universal Log Pre-processing Framework (ULPF)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Antigravity Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.2.0",
    "structlog==24.1.0",
    "opensearch-py==2.4.2",
    "minio==7.2.5",
    "kafka-python-ng==2.2.2",
    "drain3==0.9.11",
    "networkx==3.2.1",
    "duckdb>=1.0.0",
    "pyarrow>=17.0.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.5",
    "httpx==0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
