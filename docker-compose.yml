version: '3.8'

services:
  ulpf-backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ulpf-data:/app/data
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - ENVIRONMENT=demo
    restart: unless-stopped

  ulpf-frontend:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ulpf-data:/app/data
    environment:
      - BACKEND_HOST=ulpf-backend
      - BACKEND_PORT=8000
    depends_on:
      - ulpf-backend
    restart: unless-stopped

volumes:
  ulpf-data:
