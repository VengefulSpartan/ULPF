# TRACELOG gateway: the one address everything outside talks to (http://<host>:8000), in front of
# the services of docker-compose.yml. docs/SERVICES.md explains the split.
#
#   GET requests that only read the archive  ->  query      (read-only database, scales on its own)
#   everything else                          ->  collector  (receivers, the one writer, outputs)
#
# Syslog does not come through here: devices send it straight to the collector's ports 514/5514.
# The routes the query service answers are backend/main.py QUERY_ROUTERS; tests/test_services.py
# checks that this map sends exactly those to it.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    # runs as an unprivileged user on a read-only file system: scratch files go to the /tmp tmpfs
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker's DNS, re-asked every 10 s, so a service that restarts with a new address is found again
    resolver 127.0.0.11 valid=10s ipv6=off;

    map "$request_method $uri" $tracelog_service {
        default  collector;
        "~^(GET|HEAD) /api/(events|integrity|analytics|export|audit|correlation|ml|formats|sources|parsers)(/|$)"  query;
    }

    server {
        listen 8000;
        client_max_body_size 256m;          # log file uploads

        location = /gateway/health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://$tracelog_service:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
            proxy_request_buffering off;    # stream large uploads and HEC batches through
            proxy_read_timeout 600s;        # audit reports, chain verification, dead-letter replay, re-parse
            proxy_send_timeout 600s;
            add_header X-TRACELOG-Service $tracelog_service always;
        }
    }
}
